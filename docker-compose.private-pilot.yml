# HTTPS private pilot. Only the edge proxy is reachable from the internet.
# DO NOT publish a public multi-tenant product using this single-owner configuration.
name: billing-copilot-pilot
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: billing_copilot
      POSTGRES_USER: billing_copilot
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Required}
    volumes:
      - pilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_copilot -d billing_copilot"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped
    networks: [private]
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: jobber
      SERVER_BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/billing_copilot
      DATABASE_USER: billing_copilot
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Required}
      PILOT_USERNAME: ${PILOT_USERNAME:?Required}
      PILOT_PASSWORD_BCRYPT: ${PILOT_PASSWORD_BCRYPT:?Required}
      PILOT_CURRENCY: ${PILOT_CURRENCY:-EUR}
      TOKEN_ENCRYPTION_KEY_B64: ${TOKEN_ENCRYPTION_KEY_B64:?Required}
      JOBBER_CLIENT_ID: ${JOBBER_CLIENT_ID:?Required}
      JOBBER_CLIENT_SECRET: ${JOBBER_CLIENT_SECRET:?Required}
      JOBBER_REDIRECT_URI: https://${APP_DOMAIN:?Required}/api/integrations/jobber/callback
      JOBBER_API_VERSION: ${JOBBER_API_VERSION:-2026-05-12}
      APP_FRONTEND_ORIGIN: https://${APP_DOMAIN:?Required}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [private]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [private]
  edge:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pilot_caddy_data:/data
      - pilot_caddy_config:/config
    ports: ["80:80", "443:443", "443:443/udp"]
    depends_on: [frontend, backend]
    restart: unless-stopped
    networks: [private]
networks:
  private:
volumes:
  pilot_postgres:
  pilot_caddy_data:
  pilot_caddy_config:
